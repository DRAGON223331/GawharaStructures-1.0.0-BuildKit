name: Build GawharaStructures

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build plugin JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show tool versions
        run: |
          java --version
          mvn --version

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Find and verify generated JAR
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find target -maxdepth 1 -type f -name 'GawharaStructures-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one GawharaStructures JAR; found ${#jars[@]}"
            ls -lah target/ || true
            exit 1
          fi
          jar_file="${jars[0]}"
          test -s "$jar_file"
          jar tf "$jar_file" | grep -Fxq 'plugin.yml'
          jar tf "$jar_file" | grep -Fxq 'com/gawharasmp/structures/GawharaStructures.class'
          jar tf "$jar_file" | grep -Fxq 'com/gawharasmp/structures/GawharaStructurePopulator.class'
          echo "jar_path=$jar_file" >> "$GITHUB_OUTPUT"
          echo "Verified JAR: $jar_file"

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GawharaStructures-JAR
          path: ${{ steps.verify.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30
