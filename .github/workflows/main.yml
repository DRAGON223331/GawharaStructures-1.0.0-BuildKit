name: Build GawharaStructures

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build plugin JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java --version
          mvn --version

      - name: Build against Paper API 26.3
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify generated plugin JAR
        run: |
          test -f target/GawharaStructures-1.0.2.jar
          jar tf target/GawharaStructures-1.0.2.jar | grep -E 'plugin.yml|GawharaStructures.class|GawharaStructurePopulator.class'

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: GawharaStructures-1.0.2
          path: target/GawharaStructures-1.0.1.jar
          if-no-files-found: error
          retention-days: 14
