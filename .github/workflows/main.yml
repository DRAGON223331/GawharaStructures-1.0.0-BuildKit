
name: Build GawharaStructures

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify JAR
        run: |
          test -f target/GawharaStructures-1.0.0.jar
          jar tf target/GawharaStructures-1.0.0.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: GawharaStructures-1.0.0
          path: target/GawharaStructures-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
