# GawharaStructures - GawharaSMP
# Structures are generated only in explicitly enabled worlds below.
# The world named "spawn" is denied even if accidentally added to the whitelist.

coins:
  enabled: true
  warden-kill: 100

generation:
  enabled: true
  chance-per-chunk: 0.025 # 2.5% per newly populated chunk if no world override exists
  require-flat-ground: true
  max-ground-variation: 3
  min-distance-between-structures: 180
  blacklisted-worlds:
    - spawn
  min-distance-from-spawn:
    world: 450
    world_nether: 120
    world_the_end: 120

worlds:
  world:
    enabled: true
    theme: overworld
    chance-per-chunk: 0.025
    structures:
      - forest_shrine
      - ruined_watchtower
      - buried_ruins
  world_nether:
    enabled: true
    theme: nether
    chance-per-chunk: 0.035
    structures:
      - soul_vault
      - magma_cache
  world_the_end:
    enabled: true
    theme: end
    chance-per-chunk: 0.045
    structures:
      - void_shrine
      - ender_observatory
  # Any world not explicitly enabled above is disabled.
  spawn:
    enabled: false
    theme: overworld
    structures: []
  # Any other world is also disabled unless explicitly enabled here.

structures:
  forest_shrine:
    enabled: true
    display-name: '&aForest Shrine'
    loot-table: overworld_rare
  ruined_watchtower:
    enabled: true
    display-name: '&6Ruined Watchtower'
    loot-table: overworld_common
  buried_ruins:
    enabled: true
    display-name: '&7Buried Ruins'
    loot-table: overworld_rare
  soul_vault:
    enabled: true
    display-name: '&5Soul Vault'
    loot-table: nether_rare
  magma_cache:
    enabled: true
    display-name: '&cMagma Cache'
    loot-table: nether_common
  void_shrine:
    enabled: true
    display-name: '&dVoid Shrine'
    loot-table: end_rare
  ender_observatory:
    enabled: true
    display-name: '&bEnder Observatory'
    loot-table: end_common

